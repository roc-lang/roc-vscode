# Opens a PR that repins CI to the latest official Roc release and resyncs the
# grammar fixture all_syntax.roc with the roc repo at that release's commit.
#
# CI installs the release pinned in test/roc-version.txt, so the only way to
# exercise a newer compiler is to bump the pin. A PR opened with GITHUB_TOKEN
# does not trigger `on: pull_request` runs, so this workflow runs the tests
# itself and reports the result in the PR description.
name: Bump Roc release

on:
  schedule:
    # Run daily at 11 AM UTC.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to pin, e.g. 0.1.0_RC1. Defaults to the latest release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            # Same as selectLatestRelease in src/platform.ts: the newest release since
            # 0.1.0_RC1, ignoring prereleases once there is a stable one.
            version="$(gh api 'repos/roc-lang/roc/releases?per_page=100' --jq '
              map(select(.draft == false and .published_at >= "2026-11-21T19:38:08Z"))
              | sort_by(.published_at)
              | (map(select(.prerelease == false)) | last) // last
              | .tag_name')"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]*$ ]]; then
            echo "Not a release tag: $version" >&2
            exit 1
          fi
          # Fails if there is no such release.
          gh api "repos/roc-lang/roc/releases/tags/$version" --silent
          commit="$(gh api "repos/roc-lang/roc/commits/$version" --jq .sha)"
          branch="roc-$version"

          echo "Pinned:  $(tr -d '\n' < test/roc-version.txt)"
          echo "Release: $version"

          skip=""
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            skip="Branch $branch already exists; not reopening it."
            echo "$skip" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "version=$version"
            echo "commit=$commit"
            echo "branch=$branch"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      # The release is built from this commit, so the fixture matches its syntax.
      - name: Sync pin and syntax fixture
        if: steps.release.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          echo "$VERSION" > test/roc-version.txt
          # The UPL requires keeping the copyright notice and a reference to the UPL.
          {
            echo "# Copied from test/echo/all_syntax_test.roc in roc-lang/roc."
            echo "# Copyright © 2019 Richard Feldman and subsequent Roc authors <roc-lang.org/authors>, licensed under the UPL-1.0."
            echo
            gh api "repos/roc-lang/roc/contents/test/echo/all_syntax_test.roc?ref=$COMMIT" \
              -H 'Accept: application/vnd.github.raw+json'
          } > test/grammar/fixtures/all_syntax.roc

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        if: steps.release.outputs.skip == ''
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.release.outputs.skip == ''
        run: npm ci

      # A syntax change shows up as a snapshot diff in the PR.
      - name: Update grammar snapshots
        if: steps.release.outputs.skip == ''
        run: npm run test:grammar -- --update

      - name: Commit bump
        id: bump
        if: steps.release.outputs.skip == ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Already up to date with $VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --all --message "Pin Roc to $VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Roc release
        id: roc
        if: steps.bump.outputs.changed == 'true'
        run: npm run test:install
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A failure is reported in the PR description instead of stopping the PR.
      - name: Run tests
        id: tests
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run check
          npm test
          xvfb-run -a npm run test:integration
        env:
          ROC_PATH: ${{ steps.roc.outputs.roc }}

      - name: Open bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail

          git push origin "$BRANCH"

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$TESTS_OUTCOME" = "success" ]; then
            tests="Tests pass with this release."
          else
            tests="Tests **fail** with this release, see the [workflow run]($run_url)."
          fi

          body="$(cat <<EOF
          Repins CI to [$VERSION](https://github.com/roc-lang/roc/releases/tag/$VERSION) and syncs \`test/grammar/fixtures/all_syntax.roc\` (and its snapshot) with \`test/echo/all_syntax_test.roc\` in roc-lang/roc at that release's commit.

          $tests
          EOF
          )"

          url="$(gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH" \
            --title "Pin Roc to $VERSION" \
            --body "$body")"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
